<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024"
  height="1024">
  <!-- NetMap icon: flat radar. Render: inkscape assets/icon.svg -w 512 -h 512 -o src/icon.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a44" />
      <stop offset="1" stop-color="#06121f" />
    </linearGradient>
    <!-- fades from the trailing edge (transparent) to the leading edge -->
    <linearGradient id="sweep" x1="430" y1="170" x2="700" y2="340"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0" />
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#bg)" />

  <!-- rings -->
  <g fill="none" stroke="#2dd4bf" stroke-width="30">
    <circle cx="512" cy="512" r="390" stroke-opacity="0.35" />
    <circle cx="512" cy="512" r="260" stroke-opacity="0.55" />
    <circle cx="512" cy="512" r="130" stroke-opacity="0.8" />
  </g>

  <!-- sweep: 45° wedge from 12 o'clock to the leading edge (top-right) -->
  <path d="M512 512 L512 122 A390 390 0 0 1 787.8 236.2 Z" fill="url(#sweep)" />
  <line x1="512" y1="512" x2="787.8" y2="236.2" stroke="#5eead4"
    stroke-width="30" stroke-linecap="round" />

  <!-- blip just found + hub -->
  <circle cx="618" cy="270" r="46" fill="#f0fdfa" />
  <circle cx="512" cy="512" r="52" fill="#5eead4" />
</svg>
