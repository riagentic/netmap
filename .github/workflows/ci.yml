name: ci

# Correctness only: format, lint, type check and tests on Linux.
# Builds and releases are made locally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DENO_DIR: ${{ github.workspace }}/.deno-cache

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: deno task fmt --check
      - run: deno task lint
      - run: deno task check
      - run: deno task test
