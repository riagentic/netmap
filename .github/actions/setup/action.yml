name: setup
description: Deno + aio (am) + the pinned framework link, on any runner OS.
runs:
  using: composite
  steps:
    - uses: denoland/setup-deno@v2
      with:
        deno-version: "2.9.7"
    - uses: actions/cache@v4
      with:
        path: .deno-cache
        key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
    - if: runner.os != 'Windows'
      shell: bash
      run: |
        curl -fsSL https://raw.githubusercontent.com/riagentic/aio/main/install.sh | sh
        echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $env:AIO_NO_PATH_WRITE = "1"
        irm https://raw.githubusercontent.com/riagentic/aio/main/install.ps1 | iex
        "$env:USERPROFILE\.deno\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
    - shell: bash
      run: am fix
